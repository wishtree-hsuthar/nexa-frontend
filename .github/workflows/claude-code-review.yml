name: Claude AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr.diff
          head -c 20000 pr.diff > pr_trimmed.diff

      # ✅ Build request JSON safely using jq
      - name: Build Claude Request
        run: |
          PROMPT=$(cat <<EOF
You are a senior software engineer performing a code review.

Review the following git diff and provide:
- Bugs
- Security issues
- Performance concerns
- Code quality improvements
- Suggestions with examples

Diff:
$(cat pr_trimmed.diff)
EOF
)

          jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "claude-3-haiku-latest",
              max_tokens: 800,
              messages: [
                {
                  role: "user",
                  content: [
                    { type: "text", text: $prompt }
                  ]
                }
              ]
            }' > request.json

      - name: Call Claude API
        run: |
          curl https://api.anthropic.com/v1/messages \
            -s \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CLAUDE_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -d @request.json > response.json

      - name: Debug Claude Response
        run: |
          cat response.json

      - name: Extract Claude Response
        id: extract
        run: |
          if jq -e '.error' response.json > /dev/null; then
            COMMENT="❌ Claude API Error:\n$(jq -r '.error.message' response.json)"
          else
            COMMENT=$(jq -r '.content[0].text // empty' response.json)

            if [ -z "$COMMENT" ]; then
              COMMENT="⚠️ Claude returned empty response. Check logs."
            fi
          fi

          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.extract.outputs.comment }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🤖 Claude AI Review\n\n" + comment
            });
