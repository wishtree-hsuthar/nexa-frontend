name: Claude AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr.diff
          head -c 20000 pr.diff > pr_trimmed.diff

      - name: Call Claude API
        id: claude
        run: |
          RESPONSE=$(curl https://api.anthropic.com/v1/messages \
            -s \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CLAUDE_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -d @- <<EOF
          {
            "model": "claude-3-haiku-20240307",
            "max_tokens": 800,
            "messages": [
              {
                "role": "user",
                "content": [
                  {
                    "type": "text",
                    "text": "You are a senior software engineer performing a code review.\n\nReview the following git diff and provide:\n- Bugs\n- Security issues\n- Performance concerns\n- Code quality improvements\n- Suggestions with examples\n\nDiff:\n$(cat pr_trimmed.diff)"
                  }
                ]
              }
            ]
          }
          EOF
          )

          echo "$RESPONSE" > response.json

      - name: Extract Claude Response
        id: extract
        run: |
          COMMENT=$(jq -r '.content[0].text' response.json)
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.extract.outputs.comment }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🤖 Claude AI Review\n\n" + comment
            });
