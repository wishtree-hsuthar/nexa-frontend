name: Claude AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr.diff
          head -c 20000 pr.diff > pr_trimmed.diff

      # ✅ Safely convert diff to JSON string (IMPORTANT FIX)
      - name: Prepare Diff for API
        id: prep
        run: |
          DIFF=$(jq -Rs . < pr_trimmed.diff)
          echo "diff=$DIFF" >> $GITHUB_OUTPUT

      - name: Call Claude API
        run: |
          RESPONSE=$(curl https://api.anthropic.com/v1/messages \
            -s \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CLAUDE_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -d "{
              \"model\": \"claude-3-haiku-latest\",
              \"max_tokens\": 800,
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": [
                    {
                      \"type\": \"text\",
                      \"text\": \"You are a senior software engineer performing a code review.\\n\\nReview the following git diff and provide:\\n- Bugs\\n- Security issues\\n- Performance concerns\\n- Code quality improvements\\n- Suggestions with examples\\n\\nDiff:\\n\" + ${{ steps.prep.outputs.diff }}
                    }
                  ]
                }
              ]
            }")

          echo "$RESPONSE" > response.json

      # ✅ Debug step (you can remove later)
      - name: Debug Claude Response
        run: |
          cat response.json

      - name: Extract Claude Response
        id: extract
        run: |
          if jq -e '.error' response.json > /dev/null; then
            ERROR_MSG=$(jq -r '.error.message' response.json)
            COMMENT="❌ Claude API Error:\n$ERROR_MSG"
          else
            COMMENT=$(jq -r '.content[0].text // empty' response.json)

            if [ -z "$COMMENT" ]; then
              COMMENT="⚠️ Claude returned empty response. Check workflow logs."
            fi
          fi

          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.extract.outputs.comment }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🤖 Claude AI Review\n\n" + comment
            });
