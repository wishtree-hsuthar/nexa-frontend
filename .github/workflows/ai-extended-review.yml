name: AI Extended Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate AI PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // 🔍 Fetch ALL changed files (pagination-safe)
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                ...context.repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            const fileList = files.map(f => `- ${f.filename}`).join("\n");

            // 📊 File type analysis
            const jsFiles = files.filter(f => f.filename.endsWith(".js")).length;
            const tsFiles = files.filter(f => f.filename.endsWith(".ts")).length;
            const testFiles = files.filter(f => f.filename.toLowerCase().includes("test")).length;

            // 🧠 Context awareness
            const hasAuth = files.some(f => f.filename.toLowerCase().includes("auth"));
            const hasApi = files.some(f => f.filename.toLowerCase().includes("api"));

            const contextInsights = `
${hasAuth ? "- 🔐 Authentication-related changes detected (high security sensitivity)" : ""}
${hasApi ? "- 🌐 API layer modifications detected" : ""}
`.trim() || "_No high-risk contextual indicators detected_";

            const comment = `
## 🤖 AI-Native Engineering Review™

Hello Team 👋,

This Pull Request has been automatically analyzed. Here’s a smart breakdown:

---

### 📁 Files Analyzed
${fileList || "_No files detected_"}

---

### 📊 Change Summary
- 🟨 JavaScript Files: ${jsFiles}
- 🟦 TypeScript Files: ${tsFiles}
- 🧪 Test Files: ${testFiles}

---

### 🧠 Context Awareness
${contextInsights}

---

### 🔍 Code Intelligence Insights
- ⚠️ Ensure consistency across modified modules
- 🧹 Large file changes may benefit from modularization
- 📦 Review dependency usage in updated files

---

### 🔐 Security Signals
- 🔍 Review input validation in changed files
- 🔑 Ensure no secrets are exposed in configs

---

### 🛠️ Automated Fix Plan (Preview)
- Normalize naming conventions
- Add validation layers where required
- Improve unit test coverage

---

### 🚀 AI Recommendation
This PR is progressing well. Applying suggested improvements will:
- Increase maintainability
- Improve scalability
- Reduce future defects

---

> ✨ _Powered by AI-assisted PR Intelligence_
`;

            // 🔁 Check if comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.body.includes("AI-Native Engineering Review™")
            );

            if (botComment) {
              // ✏️ Update existing comment
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // 💬 Create new comment
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: comment
              });
            }
